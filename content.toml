# ─────────────────────────────────────────────────────────────────────────────
#  Единственный источник контента сайта. Правишь здесь → `make site`.
#  Языки: en (в корне), ru (/ru/), kk (/kk/). Пустой ru/kk → подставится en.
#
#  СТРУКТУРА = ОГЛАВЛЕНИЕ.
#    [[chapters]]                  → 1, 2, 3, 4
#    [[chapters.sections]]         → 1.1, 4.2 …
#    [[chapters.sections.items]]   → 4.1a, 4.1b …  (буквы в оглавлении
#                                     появляются, только если items > 1)
#
#  type секции: "kv" | "links" | "entries" | "list"
#  draft = true  → блок целиком выпадает из HTML (слот под будущий текст);
#                  сборка напоминает о нём в логе.
# ─────────────────────────────────────────────────────────────────────────────

[site]
repo = "https://github.com/baimurzzin/baimurzzin.github.io"
# Счётчик GoatCounter. Пусто → тега аналитики в сборке нет вообще.
goatcounter = "https://baimurzzin.goatcounter.com/count"
toc_title = { en = "Contents", ru = "Содержание", kk = "Мазмұны" }

[site.ui]
font = { en = "font", ru = "шрифт", kk = "қаріп" }
background = { en = "background", ru = "фон", kk = "фон" }
theme = { en = "theme", ru = "тема", kk = "тақырып" }

[site.title]
en = "Rakhim Baimurzin"
ru = "Рахим Баймурзин"
kk = "Рахим Баймурзин"

[site.description]
en = "Rakhim Baimurzin — mathematician and programmer. CV, honors, research and contacts."
ru = "Рахим Баймурзин — математик и программист. Резюме, награды, исследования и контакты."
kk = "Рахим Баймурзин — математик және бағдарламашы. Түйіндеме, марапаттар, зерттеу және байланыс."


