# ── 1.1 about ────────────────────────────────────────────────────────────────
[[chapters.sections]]
id = "about"
type = "text"
title = { en = "about", ru = "о себе", kk = "өзім туралы" }

[[chapters.sections.paragraphs]]
en = """
hey! my name is Rakhim and i'm from the industrial city of **Karaganda**. currently i am located in **Astana, Kazakhstan**. i speak english, russian and kazakh. i am an IMO medalist, and i do a bit of AI/ML, a little bit of programming, and a tiny bit of research math.
"""
ru = """
привет! меня зовут Рахим, я из промышленной **Караганды**. сейчас живу в **Астане, Казахстан**. говорю на английском, русском и казахском. я медалист IMO, немного занимаюсь AI/ML, чуть-чуть программированием и совсем чуть-чуть исследовательской математикой.
"""
kk = """
сәлем! менің атым Рахим, өнеркәсіптік **Қарағанды** қаласынанмын. қазір **Астанада, Қазақстанда** тұрамын. ағылшынша, орысша және қазақша сөйлеймін. мен IMO медалистімін, аздап AI/ML-мен, сәл бағдарламалаумен және мүлдем аздап зерттеу математикасымен айналысамын.
"""

